<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F4EC">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="용돈 탐험대">
<meta name="description" content="아이 용돈·저축·모의투자를 한 곳에서 기록하는 우리 집 용돈 놀이터">
<title>용돈 탐험대 · 아이 용돈 &amp; 모의투자</title>
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="512x512" href="assets/icon-512.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="format-detection" content="telephone=no">
<style>
:root{
  --bg:#F7F4EC;
  --bg2:#FBF9F3;
  --card:#FFFFFF;
  --ink:#22262E;
  --ink2:#525A66;
  --muted:#9A9384;
  --line:#EDE7D9;
  --line2:#F4EFE4;
  --in:#0F766E;
  --in-bg:#E3F3F0;
  --in-ink:#0B5F59;
  --out:#DE5840;
  --out-bg:#FCEBE6;
  --sav:#0E9F6E;
  --sav-bg:#E3F7ED;
  --inv:#5B5BD6;
  --inv-bg:#ECECFD;
  --don:#D2870A;
  --don-bg:#FCF1DC;
  --pink:#DB2777;
  --gold:#F2B233;
  --navy:#2A3350;
  --shadow:0 3px 16px rgba(34,38,46,.055);
  --shadow-lg:0 10px 34px rgba(34,38,46,.12);
  --r:22px;
  --r-sm:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,"Segoe UI",Roboto,sans-serif;
  font-size:15px;line-height:1.5;
  letter-spacing:-.01em;
  padding-bottom:34px;
  overflow-x:hidden;
}
h1,h2,h3,h4,p{margin:0}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
a{color:inherit}
.hide{display:none !important}
.stack{display:grid;gap:13px;min-width:0;align-content:start}
.col{min-width:0}
.muted{color:var(--muted)}
.ink2{color:var(--ink2)}
.small{font-size:12.5px}
.xs{font-size:11.5px}
.b{font-weight:700}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.right{text-align:right}
.center{text-align:center}
.row{display:flex;align-items:center;gap:8px}
.row.wrap{flex-wrap:wrap}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grow{flex:1 1 auto;min-width:0}
.nowrap{white-space:nowrap}

/* ---------- shell ---------- */
.top{
  position:sticky;top:0;z-index:30;
  background:linear-gradient(180deg,rgba(247,244,236,.98) 72%,rgba(247,244,236,.9));
  backdrop-filter:saturate(1.2) blur(10px);
  border-bottom:1px solid var(--line);
}
.wrap{max-width:1180px;margin:0 auto;padding:0 14px}
.topbar{display:flex;align-items:center;gap:10px;padding:11px 0 8px;min-width:0}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand .logo{
  width:38px;height:38px;flex:0 0 38px;border-radius:13px;display:grid;place-items:center;
  background:linear-gradient(145deg,#FFE6B8,#FBD08C);font-size:21px;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.6)
}
.brand h1{font-size:17px;font-weight:800;letter-spacing:-.03em;line-height:1.15}
.brand small{display:block;font-size:11px;color:var(--muted);font-weight:600;letter-spacing:0}
.top-actions{margin-left:auto;display:flex;gap:6px;align-items:center;flex:0 0 auto}

/* kid chips */
.kidbar{display:flex;flex-wrap:wrap;gap:7px;padding:2px 0 10px;min-width:0}
.kid{
  display:inline-flex;align-items:center;gap:6px;padding:6px 11px 6px 8px;border-radius:999px;
  background:#fff;border:1.5px solid var(--line);font-weight:700;font-size:13px;color:var(--ink2);
  min-height:36px;max-width:100%;
}
.kid .av{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:13px;flex:0 0 22px;background:var(--line2)}
.kid.on{border-color:#F2B233;background:#FFF8E7;color:var(--ink);box-shadow:0 2px 10px rgba(242,178,51,.18)}
.kid.add{border-style:dashed;color:var(--muted);background:transparent}
.kid .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:9.5em}

/* tabs */
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;padding-bottom:9px}
.tabs.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.tab{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  padding:7px 2px 6px;border-radius:14px;background:#fff;border:1.5px solid var(--line);
  font-size:11.5px;font-weight:700;color:var(--ink2);line-height:1.15;min-width:0;text-align:center;
  overflow:hidden;
}
.tab .ic{font-size:16px;line-height:1}
.tab .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.tab.on{background:var(--navy);border-color:var(--navy);color:#fff}
@media(min-width:760px){
  .tab{flex-direction:row;gap:7px;font-size:13.5px;padding:11px 8px;border-radius:16px}
}

/* ---------- generic ---------- */
main{padding-top:14px}
.grid{display:grid;gap:13px;grid-template-columns:minmax(0,1fr)}
@media(min-width:900px){
  .grid.two{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);align-items:start}
  .grid.split{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}
}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid rgba(237,231,217,.85);padding:16px;min-width:0}
.card.tight{padding:13px}
.card.flush{padding:0;overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:11px;min-width:0}
.card-h h2{font-size:15px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:6px;min-width:0}
.card-h h2 .em{font-size:16px}
.card-h .sub{font-size:12px;color:var(--muted);font-weight:600}
.sub-h{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.04em;margin:14px 2px 8px}
.divider{height:1px;background:var(--line);margin:13px 0}

/* buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:44px;padding:0 15px;border-radius:13px;background:#fff;border:1.5px solid var(--line);
  font-weight:800;font-size:14px;color:var(--ink);white-space:nowrap;transition:transform .06s,background .15s;
}
.btn:active{transform:scale(.975)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.warm{background:#F2B233;border-color:#F2B233;color:#3B2A05}
.btn.soft{background:var(--bg2);border-color:var(--line)}
.btn.on{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.teal{background:var(--in-bg);border-color:#BFE2DC;color:var(--in-ink)}
.btn.coral{background:var(--out-bg);border-color:#F7CFC4;color:#A83A24}
.btn.green{background:var(--sav-bg);border-color:#BEEBD8;color:#07724F}
.btn.indigo{background:var(--inv-bg);border-color:#CFD0FA;color:#3F3FB0}
.btn.solid-inv{background:var(--inv);border-color:var(--inv);color:#fff;box-shadow:0 4px 14px rgba(91,91,214,.28)}
.txscroll{max-height:430px;overflow-y:auto;padding-right:2px;-webkit-overflow-scrolling:touch}
.btn.sm{min-height:36px;padding:0 11px;border-radius:11px;font-size:13px}
.btn.xs{min-height:30px;padding:0 9px;border-radius:9px;font-size:12px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;pointer-events:none}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink2)}
.btn.danger{color:#B4382A;border-color:#F3CEC5;background:#FDF0EC}

/* balance hero */
.hero{
  border-radius:26px;padding:17px;color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#2F3A5C 0%,#3E4870 55%,#4A4E86 100%);
  box-shadow:0 10px 26px rgba(42,51,80,.24);
}
.hero:after{
  content:"";position:absolute;right:-42px;top:-54px;width:190px;height:190px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,rgba(255,214,133,.5),rgba(255,214,133,0) 68%);
}
.hero .lbl{font-size:12px;font-weight:700;color:#CBD2EE;letter-spacing:.02em}
.hero .bal{font-size:clamp(30px,7.2vw,40px);font-weight:800;letter-spacing:-.03em;line-height:1.1;margin-top:1px}
.hero .bal small{font-size:.5em;font-weight:700;color:#C9D0EA;margin-left:2px}
.hero .assets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:13px}
.hero .assets.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.hero .assets .a{background:rgba(255,255,255,.1);border-radius:13px;padding:8px 9px;min-width:0}
.hero .assets .a b{display:block;font-size:14px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero .assets .a span{font-size:10.5px;font-weight:700;color:#C4CCE8;display:block}
.hero .goal-mini{margin-top:11px;background:rgba(255,255,255,.1);border-radius:13px;padding:9px 10px}
.hero .goal-mini .between{font-size:11.5px;font-weight:700;color:#D3D9F0}
.hero .goal-mini .bar{height:7px;border-radius:99px;background:rgba(255,255,255,.22);margin-top:6px;overflow:hidden}
.hero .goal-mini .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#7DE3C4,#F2D17F)}

/* stat tiles */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
@media(min-width:600px){.stats.c4{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{background:var(--bg2);border-radius:var(--r-sm);padding:11px 12px;min-width:0}
.stat .k{font-size:11.5px;font-weight:800;color:var(--muted);display:flex;align-items:center;gap:4px}
.stat .v{font-size:18px;font-weight:800;letter-spacing:-.03em;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat.in .v{color:var(--in)} .stat.out .v{color:var(--out)}
.stat.sav .v{color:var(--sav)} .stat.inv .v{color:var(--inv)} .stat.don .v{color:var(--don)}

/* presets */
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(133px,1fr));gap:8px}
@media(max-width:420px){.presets{grid-template-columns:repeat(2,minmax(0,1fr))}}
.preset{
  display:flex;align-items:center;gap:9px;padding:11px 11px;border-radius:16px;background:#fff;
  border:1.5px solid var(--line);text-align:left;min-width:0;min-height:56px;box-shadow:0 1px 0 rgba(0,0,0,.02)
}
.preset:active{transform:scale(.97)}
.preset .pe{width:32px;height:32px;flex:0 0 32px;border-radius:11px;display:grid;place-items:center;font-size:18px;background:#FFF6E3}
.preset .pt{min-width:0;flex:1 1 auto}
.preset .pt b{display:block;font-size:12.5px;font-weight:800;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.preset .pt span{display:block;font-size:12px;font-weight:800;color:var(--in);margin-top:1px}
.preset.flash{background:#E9F7F2;border-color:#9CDEC8}
.preset.add{border-style:dashed;color:var(--muted);justify-content:center;font-weight:800;font-size:12.5px;background:transparent}

/* quick actions */
.qa{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media(min-width:600px){.qa{grid-template-columns:repeat(4,minmax(0,1fr))}}
.qa .btn{width:100%;min-height:50px;flex-direction:column;gap:2px;font-size:12px;line-height:1.1;padding:6px 4px;border-radius:15px}
.qa .btn .ic{font-size:17px}

/* selectors */
.seg{display:inline-flex;background:var(--bg2);border-radius:12px;padding:3px;gap:2px;border:1px solid var(--line);max-width:100%;flex-wrap:wrap}
.seg button{padding:7px 12px;border-radius:9px;font-size:12.5px;font-weight:800;color:var(--ink2);min-height:34px}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 6px rgba(0,0,0,.1)}
.mnav{display:flex;align-items:center;gap:6px}
.mnav .m{font-size:15px;font-weight:800;letter-spacing:-.02em;min-width:0}
.mnav button{width:34px;height:34px;border-radius:11px;background:var(--bg2);border:1px solid var(--line);font-size:15px;line-height:1}

/* calendar */
.cal{margin-top:2px}
.cal-dow,.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-dow div{text-align:center;font-size:10.5px;font-weight:800;color:var(--muted);padding-bottom:5px}
.cal-dow div:first-child{color:#D06A55}
.cal-dow div:last-child{color:#5C7FC0}
.cal-cell{
  position:relative;border-radius:11px;background:var(--bg2);padding:5px 3px 4px;min-height:57px;
  display:flex;flex-direction:column;align-items:center;gap:1px;border:1.5px solid transparent;min-width:0;overflow:hidden;
}
.cal-cell.empty{background:transparent}
.cal-cell .d{font-size:11px;font-weight:800;color:var(--ink2);line-height:1.2}
.cal-cell.sun .d{color:#D06A55}
.cal-cell.sat .d{color:#5C7FC0}
.cal-cell .am{font-size:9px;font-weight:800;letter-spacing:-.04em;line-height:1.15;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.cal-cell .am.i{color:var(--in)}
.cal-cell .am.o{color:var(--out)}
.cal-cell.today{border-color:#F2B233;background:#FFFAEE}
.cal-cell.today .d{color:#B67B0A}
.cal-cell.sel{border-color:var(--navy);box-shadow:0 3px 12px rgba(42,51,80,.16)}
.cal-cell.has{cursor:pointer}
@media(min-width:700px){.cal-cell{min-height:70px}.cal-cell .d{font-size:12.5px}.cal-cell .am{font-size:10.5px}}

/* tx list */
.tx{display:flex;align-items:flex-start;gap:9px;padding:9px 0;border-bottom:1px solid var(--line2);min-width:0}
.tx:last-child{border-bottom:0}
.tx .dot{width:30px;height:30px;flex:0 0 30px;border-radius:10px;display:grid;place-items:center;font-size:14px;background:var(--bg2)}
.tx .body{flex:1 1 auto;min-width:0}
.tx .mt{font-size:13.5px;font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.tx .sm{font-size:11.5px;color:var(--muted);margin-top:1px;display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.tx .amt{font-weight:800;font-size:14.5px;white-space:nowrap;letter-spacing:-.02em}
.tx .amt.i{color:var(--in)} .tx .amt.o{color:var(--out)}
.tx .del{width:28px;height:28px;flex:0 0 28px;border-radius:9px;color:#C9BFAC;font-size:15px;display:grid;place-items:center}
.tx .del:hover{background:var(--out-bg);color:var(--out)}
.empty-box{padding:20px 10px;text-align:center;color:var(--muted);font-size:12.5px;line-height:1.7}
.empty-box .big{font-size:26px;display:block;margin-bottom:4px;opacity:.75}

/* pills */
.pill{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:99px;font-size:10.5px;font-weight:800;letter-spacing:-.01em;white-space:nowrap}
.pill.소비{background:var(--out-bg);color:#B8452F}
.pill.저축{background:var(--sav-bg);color:#07724F}
.pill.투자{background:var(--inv-bg);color:#4444BE}
.pill.기부{background:#FCE9F1;color:var(--pink)}
.pill.용돈{background:var(--in-bg);color:var(--in-ink)}
.pill.보너스{background:#FCF1DC;color:#A76A05}
.pill.약속{background:#EAF2FE;color:#2F5FA8}
.pill.인출{background:#F3EFFA;color:#6B4EA8}
.pill.회수{background:#E8F6F8;color:#0E6A78}

/* progress / goal */
.prog{height:16px;border-radius:99px;background:var(--line2);overflow:hidden;position:relative;box-shadow:inset 0 1px 2px rgba(0,0,0,.06)}
.prog i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#34C79A,#0E9F6E);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.prog.thin{height:9px}
.prog .glow{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.35),transparent 55%)}
.goal-name{font-size:16px;font-weight:800;letter-spacing:-.02em;overflow-wrap:anywhere}
.badge-ach{display:inline-flex;align-items:center;gap:4px;background:linear-gradient(135deg,#FFE9AE,#F7C95D);color:#7A4E00;font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:99px;box-shadow:0 2px 8px rgba(242,178,51,.35)}

/* donut */
.donut-wrap{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.donut{
  width:132px;height:132px;flex:0 0 132px;border-radius:50%;position:relative;
  background:conic-gradient(var(--line2) 0 100%);
}
.donut:after{
  content:"";position:absolute;inset:19px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 1px var(--line2);
}
.donut .ctr{position:absolute;inset:0;display:grid;place-content:center;text-align:center;z-index:2;line-height:1.2}
.donut .ctr b{font-size:16px;font-weight:800;letter-spacing:-.03em;display:block}
.donut .ctr span{font-size:10.5px;color:var(--muted);font-weight:800}
.legend{flex:1 1 150px;min-width:0;display:grid;gap:7px}
.legend .lg{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:7px;align-items:center;font-size:12px;font-weight:700}
.legend .sw{width:10px;height:10px;border-radius:3px}
.legend .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend .pc{color:var(--muted);font-weight:800;font-size:11px}
.legend .am{font-weight:800;white-space:nowrap}
.catbars{display:grid;gap:9px}
.catbar .between{font-size:12px;font-weight:800;margin-bottom:4px}
.catbar .track{height:9px;border-radius:99px;background:var(--line2);overflow:hidden}
.catbar .track i{display:block;height:100%;border-radius:99px}

/* investment */
.co-grid{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
@media(min-width:640px){.co-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.co{
  border-radius:18px;border:1.8px solid var(--line);background:#fff;padding:12px;text-align:left;min-width:0;position:relative;
  transition:border-color .15s,background .15s;
}
.co.on{border-color:var(--navy);background:#FCFBFF;box-shadow:0 4px 16px rgba(42,51,80,.09)}
.co .top-r{display:flex;align-items:center;gap:9px;min-width:0}
.co .ce{width:40px;height:40px;flex:0 0 40px;border-radius:13px;display:grid;place-items:center;font-size:21px}
.co .cn{min-width:0;flex:1 1 auto}
.co .cn b{display:block;font-size:13.5px;font-weight:800;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.co .cn span{font-size:10.5px;color:var(--muted);font-weight:700}
.co .price{text-align:right;flex:0 0 auto}
.co .price b{display:block;font-size:14px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.co .chg{font-size:11.5px;font-weight:800;white-space:nowrap}
.up{color:#D94A3D} .down{color:#2E6FD0} .flat{color:var(--muted)}
.co .news{margin-top:9px;background:var(--bg2);border-radius:12px;padding:9px 10px}
.co .news .hl{font-size:12.5px;font-weight:800;line-height:1.35;letter-spacing:-.02em;overflow-wrap:anywhere}
.co .news .bd{font-size:11.5px;color:var(--ink2);margin-top:3px;line-height:1.45;overflow-wrap:anywhere}
.co .tone{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:99px;margin-bottom:5px}
.tone.good{background:#E5F7EE;color:#0A7A52}
.tone.neutral{background:#EEF0F4;color:#5B636F}
.tone.risky{background:#FDECE7;color:#B8452F}
.co .pick{margin-top:9px;padding-bottom:1px;display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;color:var(--muted)}

function seasonTags(dateStr){
  const d = pdate(dateStr||todayStr());
  const m = d.getMonth()+1, day = d.getDate();
  const out = [];
  SEASONS.forEach(s=>{
    let hit = false;
    if(s.around){
      hit = s.around.some(x=>Math.abs((pdate(x)-d)/86400000) <= (s.span||4));
    } else if(s.test){ hit = s.test(m, day); }
    if(hit) out.push({tag:s.tag, label:s.label, emoji:SEASON_EMOJI[s.tag]||'📅'});
  });
  return out;
}

function autoCompanyFor(text){
  const t = String(text||'').toLowerCase();
  if(!t) return null;
  let best = null, bestScore = 0;
  Object.keys(EVENT_KEYWORDS).forEach(id=>{
    let score = 0;
    EVENT_KEYWORDS[id].forEach(k=>{ if(t.includes(k.toLowerCase())) score += k.length; });
    if(score > bestScore){ bestScore = score; best = id; }
  });
  return best;
}

/* ---------- 날짜 ---------- */
const pad2 = n => String(n).padStart(2,'0');
function dstr(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function pdate(s){ const p=String(s).split('-').map(Number); return new Date(p[0], (p[1]||1)-1, p[2]||1); }
function addDays(s,n){ const d=pdate(s); d.setDate(d.getDate()+n); return dstr(d); }
function todayStr(){ return dstr(new Date()); }
function mondayOf(s){ const d=pdate(s); const off=(d.getDay()+6)%7; d.setDate(d.getDate()-off); return dstr(d); }
function dowOf(s){ return pdate(s).getDay(); }
function daysInMonth(y,m){ return new Date(y, m+1, 0).getDate(); }
function fmtDateKo(s){ const d=pdate(s); return (d.getMonth()+1)+'월 '+d.getDate()+'일 ('+DOW[d.getDay()]+')'; }
function fmtDateShort(s){ const d=pdate(s); return (d.getMonth()+1)+'/'+d.getDate(); }

/* ---------- 숫자 ---------- */
function fmt(n){ const v=Math.round(Number(n)||0); return (v<0?'-':'')+Math.abs(v).toLocaleString('ko-KR')+'원'; }
function fmtAbs(n){ return Math.round(Math.abs(Number(n)||0)).toLocaleString('ko-KR'); }
function fmtNum(n){ return Math.round(Number(n)||0).toLocaleString('ko-KR'); }
function parseAmount(v){ const n=Number(String(v).replace(/[^0-9.-]/g,'')); return isFinite(n)?Math.round(n):0; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }

/* ---------- 결정적 난수 (같은 주/아이는 같은 결과) ---------- */
function hashStr(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

/* ---------- 기본값 ---------- */
function defaultPresets(){
  return [
    {id:uid(), emoji:'🧹', label:'방 정리', amount:1000},
    {id:uid(), emoji:'🛒', label:'심부름', amount:500},
    {id:uid(), emoji:'📚', label:'책 1권 읽기', amount:1000}
  ];
}
function genNews(childId, round, dateStr){
  const rng = mulberry32(hashStr(childId+'#news#'+round));
  const tones = ['good','risky','neutral','neutral'];
  for(let i=tones.length-1;i>0;i--){ const j=Math.floor(rng()*(i+1)); const t=tones[i]; tones[i]=tones[j]; tones[j]=t; }
  const items = COMPANIES.map((c,i)=>{
    const tone = tones[i];
    const bank = NEWS[c.id][tone];
    const item = bank[Math.floor(rng()*bank.length)];
    return {id:c.id, tone, headline:item.h, body:item.b, source:'base'};
  });
  /* 계절·명절 맥락을 기사 한 곳에 자연스럽게 섞는다 (좋은 소식·조심 소식은 최소 1개 유지) */
  const tags = seasonTags(dateStr || todayStr());
  if(tags.length){
    const r2 = mulberry32(hashStr(childId+'#season#'+round));
    if(r2() < 0.8){
      const tag = tags[Math.floor(r2()*tags.length)];
      const pool = (SEASON_NEWS[tag.tag] && SEASON_NEWS[tag.tag].items) || {};
      const coIds = Object.keys(pool).filter(id=>COMPANIES.some(c=>c.id===id));
      const start = Math.floor(r2()*Math.max(1,coIds.length));
      const ordered = coIds.slice(start).concat(coIds.slice(0,start));
      for(const coId of ordered){
        const idx = items.findIndex(x=>x.id===coId);
        if(idx < 0) continue;
        const left = items.filter((x,i)=>i!==idx).map(x=>x.tone);
        if(!(left.includes('good') && left.includes('risky'))) continue;
        const arr = pool[coId];
        const it = arr[Math.floor(r2()*arr.length)];
        items[idx] = {id:coId, tone:it.tone, headline:it.h, body:it.b, source:'season'};
        break;
      }
    }
  }
  return items;
}
function newMarket(today){
  const week = mondayOf(today||todayStr());
  const prices = {}; COMPANIES.forEach(c=>prices[c.id]=c.price);
  return {round:0, weekStart:week, prices, news:null, pickedId:null, invested:0, holdings:{}, history:[], injections:[]};
}

}

function normalize(s){
  if(!s || typeof s!=='object') return null;
  if(!Array.isArray(s.children) || !s.children.length) return null;
  s.pin = s.pin && typeof s.pin==='object' ? {enabled:!!s.pin.enabled, code:String(s.pin.code||'')} : {enabled:false, code:''};
  s.children.forEach(c=>{
    c.cash = Number(c.cash)||0;
    c.savings = Number(c.savings)||0;
    c.tx = Array.isArray(c.tx)?c.tx:[];
    c.investEnabled = c.investEnabled !== false;
    c.presets = Array.isArray(c.presets)?c.presets:defaultPresets();
    c.goal = c.goal && typeof c.goal==='object' ? {name:c.goal.name||'', target:Number(c.goal.target)||0} : {name:'', target:0};
    c.auto = c.auto && typeof c.auto==='object' ? c.auto : {mode:'none', amount:1000, weekday:1, monthday:1, last:todayStr()};
    if(!c.market || typeof c.market!=='object'){
      c.market = newMarket();
    }
    const m=c.market;
    m.round = Number(m.round)||0;
    m.weekStart = m.weekStart || mondayOf(todayStr());
    m.prices = m.prices && typeof m.prices==='object' ? m.prices : {};
    COMPANIES.forEach(co=>{ m.prices[co.id] = Number(m.prices[co.id])||co.price; });
    m.holdings = m.holdings && typeof m.holdings==='object' ? m.holdings : {};
    m.history = Array.isArray(m.history)?m.history:[];
    m.pickedId = m.pickedId || null;
    m.invested = Number(m.invested)||0;
    m.injections = Array.isArray(m.injections) ? m.injections : [];
    if(!Array.isArray(m.news) || m.news.length!==4) m.news = genNews(c.id, m.round, m.weekStart);
  });
  if(!s.activeId || !s.children.some(c=>c.id===s.activeId)) s.activeId = s.children[0].id;
  return s;
}

function txOfMonth(c, y, m){

/* ---------- 거래 ---------- */
function addTx(c, t){
  const tx = {
    id:uid(), date:t.date||todayStr(), kind:t.kind, cat:t.cat,
    amount:Math.max(1, Math.round(Number(t.amount)||0)),
    memo:t.memo||'', key:t.key||null, ts:Date.now()
  };
  c.tx.push(tx);
  if(tx.kind==='in') c.cash += tx.amount; else c.cash -= tx.amount;
  return tx;
}
function removeTx(c, id){
  const i = c.tx.findIndex(t=>t.id===id);
  if(i<0) return {ok:false};
  const t = c.tx[i];
  if(t.cat==='투자'||t.cat==='투자회수') return {ok:false, reason:'invest'};
  if(t.kind==='in'){ c.cash -= t.amount; if(t.cat==='저축인출') c.savings += t.amount; }
  else { c.cash += t.amount; if(t.cat==='저축') c.savings = Math.max(0, c.savings - t.amount); }
  c.tx.splice(i,1);
  return {ok:true, tx:t};
}

function depositSavings(c, amount, date, memo){
  if(amount<=0) return {ok:false, reason:'amount'};
  if(amount>c.cash) return {ok:false, reason:'cash'};
  addTx(c, {date, kind:'out', cat:'저축', amount, memo:memo||'저축 통장에 넣기'});
  c.savings += amount;
  return {ok:true};
}
function withdrawSavings(c, amount, date, memo){
  if(amount<=0) return {ok:false, reason:'amount'};
  if(amount>c.savings) return {ok:false, reason:'savings'};
  addTx(c, {date, kind:'in', cat:'저축인출', amount, memo:memo||'저축 통장에서 꺼내기'});
  c.savings -= amount;
  return {ok:true};
}

/* ---------- 자동 용돈 ---------- */
function autoDates(rule, lastStr, today){
  const out = [];
  if(!rule || rule.mode==='none' || !rule.amount) return out;
  const last = pdate(lastStr || today);
  const end = pdate(today);
  if(last >= end) {
    // 같은 날: 매일 규칙은 이미 지급된 것으로 본다
    return out;
  }
  if(rule.mode==='daily'){
    let d = pdate(addDays(lastStr||today,1)), guard=0;
    while(d<=end && guard++<400){ out.push(dstr(d)); d.setDate(d.getDate()+1); }
  } else if(rule.mode==='weekly'){
    let d = pdate(addDays(lastStr||today,1)), guard=0;
    while(d<=end && guard++<800){
      if(d.getDay()===Number(rule.weekday)) out.push(dstr(d));
      d.setDate(d.getDate()+1);
    }
  } else if(rule.mode==='monthly'){
    let y = last.getFullYear(), m = last.getMonth();
    for(let i=0;i<40;i++){
      m++; if(m>11){ m=0; y++; }
      const dim = daysInMonth(y,m);
      const day = Math.min(Math.max(1, Number(rule.monthday)||1), dim);
      const d = new Date(y,m,day);
      if(d>end) break;
      if(d>last) out.push(dstr(d));
    }
  }
  return out;
}
function autoMemo(rule){
  if(rule.mode==='daily') return '자동 용돈 (매일)';
  if(rule.mode==='weekly') return '자동 용돈 (매주 '+DOW_FULL[Number(rule.weekday)]+')';
  return '자동 용돈 (매달 '+(rule.monthday)+'일)';
}
function applyAutoAllowance(c){
  const r = c.auto;
  if(!r || r.mode==='none' || !r.amount) return {count:0, total:0};
  if(!r.last) r.last = todayStr();
  const dates = autoDates(r, r.last, todayStr());
  let total = 0, count = 0;
  dates.forEach(d=>{
    const key = 'auto:'+r.mode+':'+d;
    if(c.tx.some(t=>t.key===key)) return;
    addTx(c, {date:d, kind:'in', cat:'용돈', amount:r.amount, memo:autoMemo(r), key});
    total += r.amount; count++;
  });
  if(dates.length) r.last = dates[dates.length-1];
  return {count, total};
}
function nextPayDate(rule){
  if(!rule || rule.mode==='none' || !rule.amount) return null;
  const today = todayStr();
  if(rule.mode==='daily') return addDays(today, 1);
  if(rule.mode==='weekly'){
    let d = pdate(today); let guard=0;
    while(guard++<14){ d.setDate(d.getDate()+1); if(d.getDay()===Number(rule.weekday)) return dstr(d); }
    return null;
  }
  if(rule.mode==='monthly'){
    let y = pdate(today).getFullYear(), m = pdate(today).getMonth();
    for(let i=0;i<24;i++){
      const dim = daysInMonth(y,m);
      const day = Math.min(Math.max(1,Number(rule.monthday)||1), dim);
      const d = new Date(y,m,day);
      if(dstr(d) > today) return dstr(d);
      m++; if(m>11){ m=0; y++; }
    }
  }
  return null;
}

/* ---------- 모의투자 ---------- */
function syncMarketWeeks(c){
  const m = c.market;
  let advanced = 0;
  if(!m.weekStart) m.weekStart = mondayOf(todayStr());
  while(advanced < 60 && addDays(m.weekStart,7) <= todayStr()){
    advanceWeek(c);
    advanced++;
  }
  return advanced;
}
function advanceWeek(c){
  const m = c.market;
  const rng = mulberry32(hashStr(c.id+'#price#'+m.round));
  const changes = {};
  COMPANIES.forEach(co=>{
    const n = (m.news||[]).find(x=>x.id===co.id) || {tone:'neutral'};
    let lo, hi;
    if(n.tone==='good'){ lo = 0.05; hi = 0.19; }
    else if(n.tone==='risky'){ lo = -0.18; hi = -0.01; }
    else { lo = -0.06; hi = 0.06; }
    const f = lo + (hi-lo)*rng();
    const from = Number(m.prices[co.id]) || co.price;
    let to = Math.round(from*(1+f)/10)*10;
    to = Math.max(200, to);
    if(to === from) to = from + (f>=0? 10 : -10);
    changes[co.id] = {from, to, pct:(to-from)/from*100};
  });
  const nextPrices = {};
  COMPANIES.forEach(co=>nextPrices[co.id] = changes[co.id].to);
  m.history.push({
    round:m.round, weekStart:m.weekStart, news:m.news,
    pricesStart:{...m.prices}, changes,
    pickedId:m.pickedId, invested:m.invested
  });
  m.round += 1;
  m.weekStart = addDays(m.weekStart, 7);
  m.prices = nextPrices;
  m.news = genNews(c.id, m.round, m.weekStart);
  m.pickedId = null;
  m.invested = 0;
  if(m.injections && m.injections.length > 12) m.injections = m.injections.slice(-12);
  return changes;
}

/* 현실 소식 주입 (보호자) */
function injectRealEvent(c, opts){
  const m = c.market;
  const co = COMPANIES.find(x=>x.id===opts.companyId);
  if(!co) return {ok:false, reason:'company'};
  const idx = m.news.findIndex(x=>x.id===co.id);
  if(idx < 0) return {ok:false, reason:'news'};
  const tone = ['good','neutral','risky'].includes(opts.tone) ? opts.tone : 'neutral';
  const prev = JSON.parse(JSON.stringify(m.news[idx]));
  const auto = makeRealArticle(co, tone, opts.text);
  const article = {
    id:co.id, tone,
    headline:(opts.headline||'').trim() || auto.headline,
    body:(opts.body||'').trim() || auto.body,
    source:'real', eventText:(opts.text||'').trim(), injectedAt:Date.now()
  };
  m.news[idx] = article;
  m.injections = (m.injections||[]).filter(x=>!(x.round===m.round && x.companyId===co.id));
  m.injections.push({id:uid(), round:m.round, companyId:co.id, tone, text:article.eventText, headline:article.headline, body:article.body, prev, at:Date.now()});
  return {ok:true, article, prev};
}
function undoInjection(c, companyId){
  const m = c.market;
  const i = (m.injections||[]).findIndex(x=>x.round===m.round && x.companyId===companyId);
  if(i < 0) return {ok:false};
  const rec = m.injections[i];
  const idx = m.news.findIndex(x=>x.id===companyId);
  if(idx >= 0 && rec.prev) m.news[idx] = rec.prev;
  m.injections.splice(i,1);
  return {ok:true};
}
function holdingOf(c, companyId){
  const h = c.market.holdings[companyId];
  if(!h || !h.units) return null;
  return h;
}
function holdingsList(c){
  return COMPANIES.map(co=>{
    const h = c.market.holdings[co.id];
    if(!h || h.units<=0.0001) return null;
    const price = Number(c.market.prices[co.id]) || co.price;
    const value = h.units*price;
    return {co, units:h.units, cost:h.cost, price, value, pl:value-h.cost};
  }).filter(Boolean);
}
function investValue(c){ return holdingsList(c).reduce((a,h)=>a+h.value,0); }
function buyStock(c, companyId, amount, date){
  const co = COMPANIES.find(x=>x.id===companyId);
  if(!co) return {ok:false, reason:'company'};
  amount = Math.round(amount);
  if(amount<=0) return {ok:false, reason:'amount'};
  if(amount > c.cash) return {ok:false, reason:'cash'};
  if(c.market.pickedId && c.market.pickedId !== companyId && c.market.invested > 0)
    return {ok:false, reason:'picked'};
  const price = Number(c.market.prices[companyId]) || co.price;
  const units = amount/price;
  const h = c.market.holdings[companyId] || {units:0, cost:0};
  h.units += units; h.cost += amount;
  c.market.holdings[companyId] = h;
  c.market.pickedId = companyId;
  c.market.invested = (c.market.invested||0) + amount;
  addTx(c, {date:date||todayStr(), kind:'out', cat:'투자', amount, memo:co.name+' 주식 사기'});
  return {ok:true, units, price};
}
function sellStock(c, companyId, units, date){
  const co = COMPANIES.find(x=>x.id===companyId);
  const h = c.market.holdings[companyId];
  if(!co || !h || h.units<=0) return {ok:false, reason:'holding'};
  units = Math.min(units||h.units, h.units);
  if(units<=0) return {ok:false, reason:'amount'};
  /* 반올림 때문에 남는 자투리 주식은 전량 매도로 처리 */
  if(h.units - units < Math.max(0.0001, h.units*0.005)) units = h.units;
  const price = Number(c.market.prices[companyId]) || co.price;
  const proceeds = Math.round(units*price);
  const costOut = h.units>0 ? h.cost*(units/h.units) : 0;
  h.cost -= costOut; h.units -= units;
  if(h.units < 0.0001){ delete c.market.holdings[companyId]; }
  else c.market.holdings[companyId] = h;
  addTx(c, {date:date||todayStr(), kind:'in', cat:'투자회수', amount:proceeds, memo:co.name+' 주식 팔기'});
  return {ok:true, proceeds, units, pl:proceeds-costOut};
}

/* ---------- 목표 ---------- */
function goalInfo(c){
  const target = Number(c.goal && c.goal.target) || 0;
  const saved = Math.max(0, c.savings);
  const pct = target>0 ? Math.min(100, saved/target*100) : 0;
  return {name:(c.goal&&c.goal.name)||'', target, saved, pct, done: target>0 && saved>=target, remain: Math.max(0, target-saved)};
}

/* ---------- 달력 계산 ---------- */
function daySums(c, key){
  const map = {};
  c.tx.forEach(t=>{
    if(String(t.date).slice(0,7) !== key) return;
    const d = Number(String(t.date).slice(8,10));
    const o = map[d] || (map[d] = {i:0, o:0});
    if(t.kind === 'in') o.i += t.amount; else o.o += t.amount;
  });
  return map;
}
function monthStats(c, y, m){
  const txs = C.txOfMonth(c, y, m);
  const inc = [], out = [];
  txs.forEach(t=> (t.kind==='in'?inc:out).push(t));
  const totalIn = C.sum(inc), totalOut = C.sum(out);
  const cat = {'소비':0,'저축':0,'투자':0,'기부':0};
  out.forEach(t=>{ if(cat[t.cat] != null) cat[t.cat] += t.amount; });
  const earned = inc.filter(t=>['용돈','보너스','약속'].includes(t.cat)).reduce((a,t)=>a+t.amount,0);
  return {txs, inc, out, totalIn, totalOut, net:totalIn-totalOut, cat, earned};
}

  const r = Math.round(pct*10)/10;
  if(r > 0) return '<span class="up">+'+r+'% ▲</span>';
  if(r < 0) return '<span class="down">'+r+'% ▼</span>';
  return '<span class="flat">0% –</span>';
}
function sparkline(vals, color){
  if(!vals || vals.length < 2) return '';
  const w = 100, h = 34, pad = 3;
  const min = Math.min(...vals), max = Math.max(...vals);
  const span = max-min || 1;
  const pts = vals.map((v,i)=>{
    const x = pad + i*(w-pad*2)/(vals.length-1);
    const y = h-pad - (v-min)/span*(h-pad*2);
    return x.toFixed(1)+','+y.toFixed(1);
  }).join(' ');
  const up = vals[vals.length-1] >= vals[0];
  return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" aria-hidden="true">'+
    '<path d="M'+pts.replace(/ /g,' L')+'" stroke="'+(up?'#DE5840':'#2E6FD0')+'" stroke-width="2"/></svg>';
}

function errBox(id){ return '<div class="note warn hide" id="'+id+'" style="margin-top:9px"></div>'; }
function showErr(id, msg){
  const el = document.getElementById(id);
  if(!el) return;
  el.textContent = msg; el.classList.remove('hide');
}

function openTx(date, kind){
  const isIn = kind === 'in';
  const body =
    '<div class="seg" id="txKind" style="margin-bottom:12px">'+
      '<button data-kind="in" class="'+(isIn?'on':'')+'">수입 +</button>'+
      '<button data-kind="out" class="'+(!isIn?'on':'')+'">지출 −</button>'+
    '</div>'+
    '<div class="field"><span>분류</span><div class="opt" id="txCat"></div></div>'+
    '<label class="field"><span>금액</span><div class="amt-box"><input id="txAmt" inputmode="numeric" autocomplete="off" placeholder="0"><span class="won">원</span></div></label>'+
    '<label class="field"><span>메모 (이유)</span><input class="input" id="txMemo" maxlength="40" placeholder="'+(isIn?'예: 할머니 용돈':'예: 문구점 색연필')+'"></label>'+
    '<label class="field"><span>날짜</span><input class="input" type="date" id="txDate" value="'+(date||C.todayStr())+'"></label>'+
    errBox('txErr')+
    '<button class="btn primary block" id="txGo" style="margin-top:6px">저장하기</button>'+
    (isIn ? '' : '<div class="hint-line"><span class="em">💡</span><span>「저축」은 쓴 돈이 아니라 <b>저축 통장으로 옮기는 돈</b>이에요.</span></div>');
  const m = U.modal({title:isIn?'수입 기록':'지출 기록', body});
  const catWrap = m.el.querySelector('#txCat');
  let curKind = isIn ? 'in' : 'out';
  let curCat = isIn ? '보너스' : '소비';

  function renderCats(){
    const ch = C.child();
    const invOn = ch.investEnabled !== false;
    const cats = curKind==='in' ? [['보너스','🎁 보너스'],['용돈','💰 용돈'],['약속','🏅 약속']]
                               : [['소비','🛍️ 소비'],['저축','🏦 저축'],['기부','💝 기부']].concat(invOn ? [['투자','📈 투자']] : []);
    if(!cats.some(x=>x[0]===curCat)) curCat = cats[0][0];
    catWrap.innerHTML = cats.map(([v,l])=>'<button data-cat="'+v+'" class="'+(curCat===v?'on '+v:'')+'">'+l+'</button>').join('');
    catWrap.querySelectorAll('button').forEach(b=>{
      b.addEventListener('click', ()=>{
        curCat = b.dataset.cat;
        catWrap.querySelectorAll('button').forEach(x=>x.classList.toggle('on', x===b));
        catWrap.querySelectorAll('button').forEach(x=>x.classList.remove(b.dataset.cat));
        b.classList.add(b.dataset.cat);
        document.getElementById('txGo').textContent = curCat==='투자' ? '투자 탭으로 가기 →' : '저장하기';
      });
    });
  }
  renderCats();
  m.el.querySelectorAll('#txKind button').forEach(b=>{
    b.addEventListener('click', ()=>{
      curKind = b.dataset.kind;
      m.el.querySelectorAll('#txKind button').forEach(x=>x.classList.toggle('on', x===b));
      curCat = curKind==='in' ? '보너스' : '소비';
      const memoEl = m.el.querySelector('#txMemo');
      if(memoEl) memoEl.placeholder = curKind==='in' ? '예: 할머니 용돈' : '예: 문구점 색연필';
      renderCats();
      document.getElementById('txGo').textContent = '저장하기';
    });
  });
  const amtEl = m.el.querySelector('#txAmt');
  amtEl.focus();
  const go = ()=>{
    const c = C.child();
    const amt = C.parseAmount(amtEl.value);
    const memo = m.el.querySelector('#txMemo').value.trim();
    const d = safeDate(m.el.querySelector('#txDate').value);
    if(curKind==='out' && curCat==='투자'){
      m.close(); ui.pick = null; U.goTab('invest');
      U.toast('투자는 회사를 고른 뒤 <b>모의투자</b> 탭에서 해요.', {emoji:'📈'});
      return;
    }
    if(!amt || amt<=0){ showErr('txErr','금액을 적어 주세요.'); amtEl.focus(); return; }
    if(curKind==='out' && curCat!=='기부' && amt > c.cash){ showErr('txErr','쓸 수 있는 돈이 '+C.fmt(c.cash)+'뿐이에요.'); return; }
    if(curKind==='out' && curCat==='기부' && amt > c.cash){ showErr('txErr','기부할 돈이 모자라요. (쓸 수 있는 돈 '+C.fmt(c.cash)+')'); return; }
    if(curKind==='in'){
      C.addTx(c, {date:d, kind:'in', cat:curCat, amount:amt, memo:memo|| (curCat==='보너스'?'특별 용돈':(curCat==='용돈'?'용돈':'약속 보상'))});
    } else if(curCat==='저축'){
      const r = C.depositSavings(c, amt, d, memo||'저축 통장에 넣기');
      if(!r.ok){ showErr('txErr','저축으로 옮길 돈이 모자라요.'); return; }
    } else {
      C.addTx(c, {date:d, kind:'out', cat:curCat, amount:amt, memo:memo||(curCat==='소비'?'쓰기':(curCat==='기부'?'기부':'지출'))});
    }
    save(); m.close();
    if(d !== C.todayStr()){ ui.selDate = d; ui.calY = C.pdate(d).getFullYear(); ui.calM = C.pdate(d).getMonth(); }
    rerender();
    U.toast('기록했어요 · '+C.fmt(amt), {emoji: curKind==='in'?'💰':'🧾'});
  };
  m.el.querySelector('#txGo').addEventListener('click', go);
  amtEl.addEventListener('keydown', e=>{ if(e.key==='Enter') go(); });
}
function safeDate(v){ return /^\d{4}-\d{2}-\d{2}$/.test(v||'') ? v : C.todayStr(); }

                   : C.withdrawSavings(c, amt, C.todayStr(), '저축 통장에서 꺼내기');
    if(!r.ok){
      showErr('svErr', isIn ? '쓸 수 있는 돈이 모자라요. (현금 '+C.fmt(c.cash)+')' : '저축한 돈이 모자라요. ('+C.fmt(c.savings)+')');
      return;

    save(); m.close(); rerender();
    U.toast(isIn?'저축 통장에 '+C.fmt(amt)+' 넣었어요':'저축 통장에서 '+C.fmt(amt)+' 꺼냈어요', {emoji:'🏦'});

function openSell(id){
  const c = C.child();
  const co = COMPANIES.find(x=>x.id===id);
  const h = c.market.holdings[id];
  if(!co || !h) return;
  const price = Number(c.market.prices[id])||co.price;
  const value = Math.round(h.units*price);
  const body =
    '<div class="weekcard"><div class="wk">'+co.emoji+' '+esc(co.name)+'</div>'+
      '<div class="between" style="margin-top:3px"><span class="xs b muted">갖고 있는 주식</span><span class="b">'+h.units.toFixed(2)+'주</span></div>'+
      '<div class="between"><span class="xs b muted">1주 가격</span><span class="b">'+C.fmt(price)+'</span></div>'+
      '<div class="between"><span class="xs b muted">전부 팔면</span><span class="b" style="color:var(--in)">'+C.fmt(value)+'</span></div></div>'+
    '<label class="field" style="margin-top:12px"><span>얼마어치 팔까요?</span><div class="amt-box"><input id="slAmt" inputmode="numeric" autocomplete="off" value="'+C.fmtNum(value)+'"><span class="won">원</span></div></label>'+
    errBox('slErr')+
    '<button class="btn primary block" id="slGo" style="margin-top:10px">팔기</button>';
  const m = U.modal({title:'주식 팔기', body});
  const inp = m.el.querySelector('#slAmt');
  m.el.querySelector('#slGo').addEventListener('click', ()=>{
    const amt = C.parseAmount(inp.value);
    if(amt<=0){ showErr('slErr','금액을 적어 주세요.'); return; }
    const units = (amt >= value - 1) ? h.units : Math.min(h.units, amt/price);
    const r = C.sellStock(c, id, units, C.todayStr());
    if(!r.ok){ showErr('slErr','팔 수 없어요.'); return; }
    save(); m.close(); rerender();
    U.toast('주식을 팔아 '+C.fmt(r.proceeds)+'이 들어왔어요', {emoji:'💵'});
  });
}

/* ---------- PIN ---------- */
function askPin(onOk){
  const body =
    '<div class="center" style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px">보호자 4자리 번호</div>'+
    '<div class="pin-dots" id="pinDots"><i></i><i></i><i></i><i></i></div>'+
    '<div class="pinpad" id="pinPad">'+
      [1,2,3,4,5,6,7,8,9].map(n=>'<button data-k="'+n+'">'+n+'</button>').join('')+
      '<button class="fn" data-k="clear">지움</button><button data-k="0">0</button><button class="fn" data-k="close">취소</button>'+
    '</div>'+
    '<div class="center xs" id="pinMsg" style="color:var(--out);font-weight:800;height:16px;margin-top:8px"></div>';
  const m = U.modal({title:'보호자 확인', body});
  let buf = '';
  const dots = m.el.querySelectorAll('#pinDots i');
  const paint = ()=> dots.forEach((d,i)=>d.classList.toggle('on', i<buf.length));
  const fail = ()=>{
    m.el.querySelector('#pinMsg').textContent = '번호가 달라요. 다시 눌러 주세요.';
    buf = ''; paint();
    const sheet = m.el.querySelector('.sheet');
    sheet.classList.add('shake');
    setTimeout(()=>sheet.classList.remove('shake'), 320);
  };
  m.el.querySelectorAll('#pinPad button').forEach(b=>{
    b.addEventListener('click', ()=>{
      const k = b.dataset.k;
      if(k==='close'){ m.close(); return; }
      if(k==='clear'){ buf = buf.slice(0,-1); paint(); return; }
      if(buf.length>=4) return;
      buf += k; paint();
      if(buf.length===4){
        if(buf === String(S().pin.code)){
          ui.unlocked = true; m.close(); onOk();
        } else { setTimeout(fail, 90); }
      }
    });
  });
}
function setPinFlow(after){
  const body =
    '<div class="set-desc">아이가 설정에 들어오지 못하도록 4자리 번호를 정해 주세요. 잊어버리면 직접 지우기 전까지는 설정에 들어갈 수 없어요.</div>'+

  m.el.querySelector('#npGo').addEventListener('click', ()=>{

/* ---------- 데이터 ---------- */
function exportJSON(){
  const data = JSON.stringify(S(), null, 2);
  const blob = new Blob([data], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '용돈탐험대-백업-'+C.todayStr()+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1500);
  U.toast('백업 파일을 저장했어요', {emoji:'💾'});
}
function importJSON(file){
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const parsed = JSON.parse(String(reader.result));
      const st = C.normalize(parsed);
      if(!st || !st.children.length) throw new Error('bad');
      U.confirmModal('백업을 불러올까요?', '지금 이 기기의 기록이 백업 파일 내용으로 바뀝니다.', '불러오기', ()=>{
        C.state = st; ui.unlocked = true; ui.pick = null;
        C.save(); rerender();
        U.toast('백업을 불러왔어요', {emoji:'📥'});
      });
    }catch(e){ U.toast('백업 파일을 읽지 못했어요', {emoji:'⚠️'}); }
  };
  reader.readAsText(file);
}
function resetAll(){
  U.confirmModal('모든 기록을 지울까요?', '아이 정보·돈·기록·투자가 모두 사라지고 처음 상태로 돌아가요. 되돌릴 수 없어요.<br>먼저 <b>백업 저장</b>을 해 두는 것을 추천해요.', '모두 지우기', ()=>{
    try{ localStorage.removeItem(C.STORE_KEY); }catch(e){}
    location.reload();
  });
}

/* ---------- 자동 용돈 저장 ---------- */
function saveAuto(){
  const c = C.child();
  const seg = $('#autoMode');
  const modeBtn = seg ? seg.querySelector('button.on') : null;
  const mode = modeBtn ? modeBtn.dataset.mode : 'none';
  const amount = C.parseAmount(($('#autoAmt')||{}).value || '0');
  const weekday = Number(($('#autoWeekday')||{}).value || 1);
  const monthday = Number(($('#autoMonthday')||{}).value || 1);
  if(mode!=='none' && amount<=0){ U.toast('금액을 적어 주세요.', {emoji:'✏️'}); return; }
  const changed = c.auto.mode !== mode;
  c.auto.mode = mode;
  c.auto.amount = amount;
  c.auto.weekday = weekday;
  c.auto.monthday = monthday;
  if(mode === 'none'){ /* 그대로 */ }
  else if(changed || !c.auto.last) c.auto.last = C.todayStr();
  const r = C.applyAutoAllowance(c);
  save(); rerender();
  const next = C.nextPayDate(c.auto);
  U.toast(mode==='none' ? '자동 용돈을 껐어요' : '자동 용돈 저장 · 다음은 '+(next?C.fmtDateKo(next):'-'),
    {emoji:'⏰'});
  if(r.count) U.toast('자동 용돈 '+r.count+'번 · '+C.fmt(r.total)+' 들어왔어요', {emoji:'💰'});
}

/* ---------- 투자 ---------- */
function pickCo(id){
  const c = C.child();
  if(c.market.pickedId && c.market.pickedId !== id && c.market.invested > 0){
    const info = COMPANIES.find(x=>x.id===c.market.pickedId) || {};
    U.toast('이번 주는 이미 '+info.emoji+' '+esc(info.name)+'에 투자했어요. 다음 주에 새로 고를 수 있어요!', {emoji:'📌'});
    return;
  }
  ui.pick = id;
  renderTabOnly();
}
function renderTabOnly(){
  // 투자 탭은 입력 중 포커스를 잃지 않도록 전체 재렌더하되 입력값을 보존
  const inp = document.getElementById('investAmt');
  const keep = inp ? inp.value : '';
  U.renderAll();
  const ni = document.getElementById('investAmt');
  if(ni && keep){ ni.value = keep; updateInvestPreview(); }
}
function updateInvestPreview(){
  const inp = document.getElementById('investAmt');
  const out = document.getElementById('invPreview');
  if(!inp || !out) return;
  const c = C.child();
  const pick = ui.pick || c.market.pickedId;
  const price = pick ? (Number(c.market.prices[pick])||0) : 0;
  const amt = C.parseAmount(inp.value);
  if(!pick){ out.innerHTML = '회사를 먼저 골라 주세요.'; return; }
  if(amt <= 0){ out.innerHTML = '금액을 적으면 몇 주를 살 수 있는지 알려 드려요.'; return; }
  if(amt > c.cash){ out.innerHTML = '<b style="color:var(--out)">쓸 수 있는 돈('+C.fmt(c.cash)+')보다 많아요.</b>'; return; }
  const units = amt/price;
  out.innerHTML = C.fmt(amt)+'으로 <b>'+(units>=1?units.toFixed(2):units.toFixed(3))+'주</b>를 살 수 있어요 · 1주 '+C.fmt(price);
}
function doInvest(){
  const c = C.child();
  const pick = ui.pick || c.market.pickedId;
  if(!pick){ U.toast('투자할 회사를 먼저 골라 주세요.', {emoji:'🔍'}); return; }
  const inp = document.getElementById('investAmt');
  const amt = C.parseAmount(inp ? inp.value : '0');
  if(amt <= 0){ U.toast('얼마나 투자할지 적어 주세요.', {emoji:'✏️'}); return; }
  const r = C.buyStock(c, pick, amt, C.todayStr());
  if(!r.ok){
    if(r.reason==='cash') U.toast('쓸 수 있는 돈이 모자라요. (현금 '+C.fmt(c.cash)+')', {emoji:'⚠️'});
    else if(r.reason==='picked') U.toast('이번 주에는 한 회사에만 투자할 수 있어요.', {emoji:'📌'});
    else U.toast('투자하지 못했어요.', {emoji:'⚠️'});
    return;
  }
  save(); ui.pick = pick;
  U.renderAll();
  const info = COMPANIES.find(x=>x.id===pick);
  U.toast(info.emoji+' '+esc(info.name)+' '+r.units.toFixed(2)+'주를 샀어요', {emoji:'📈'});
}
function advanceWeekAction(){
  const c = C.child();
  U.confirmModal('다음 주 월요일로 넘길까요?', '이번 주 기사 방향과 흔들림에 따라 '+esc(c.name)+'의 주가가 바뀌어요. 지나간 주는 되돌릴 수 없어요.', '넘기기', ()=>{
    const picked = c.market.pickedId;
    C.advanceWeek(c);
    save(); ui.pick = null; U.renderAll();
    const h = c.market.history[c.market.history.length-1];
    let msg = '새 주가 시작됐어요! 다음 주 월요일로 넘어갔어요.';
    if(picked){
      const info = COMPANIES.find(x=>x.id===picked) || {};
      const ch = h && h.changes[picked];
      if(ch) msg = info.emoji+' 내가 고른 '+info.name+' '+(ch.pct>0?'+':'')+ch.pct.toFixed(1)+'% 움직였어요';
    }
    U.toast(msg, {emoji:'🔔', duration:4200});
  });
}

function bindSettings(c){
  const seg = document.getElementById('autoMode');
  if(seg){
    seg.querySelectorAll('button').forEach(b=> b.addEventListener('click', ()=>{
      seg.querySelectorAll('button').forEach(x=>x.classList.toggle('on', x===b));
      const mode = b.dataset.mode;
      const w = document.getElementById('autoWeekdayWrap');
      const mo = document.getElementById('autoMonthdayWrap');
      if(w) w.classList.toggle('hide', mode!=='weekly');
      if(mo) mo.classList.toggle('hide', mode!=='monthly');
    }));
  }
  const chips = document.getElementById('evChips');
  if(chips){
    chips.querySelectorAll('[data-ev]').forEach(b=> b.addEventListener('click', ()=>{
      const txt = document.getElementById('evText');
      txt.value = b.dataset.ev;
      chips.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));
      b.classList.add('on');
      const co = b.dataset.co, tone = b.dataset.tone;
      document.querySelectorAll('#evCompany button').forEach(x=>x.classList.toggle('on', x.dataset.co===co));
      document.querySelectorAll('#evTone button').forEach(x=>x.classList.toggle('on', x.dataset.tone===tone));
      updateAutoHint();
    }));
  }
  const coBox = document.getElementById('evCompany');
  if(coBox){
    coBox.querySelectorAll('button').forEach(b=> b.addEventListener('click', ()=>{
      coBox.querySelectorAll('button').forEach(x=>x.classList.toggle('on', x===b));
      updateAutoHint();
    }));
  }
  const toneBox = document.getElementById('evTone');
  if(toneBox){
    toneBox.querySelectorAll('button').forEach(b=> b.addEventListener('click', ()=>{
      toneBox.querySelectorAll('button').forEach(x=>x.classList.toggle('on', x===b));
    }));
  }
  const evText = document.getElementById('evText');
  if(evText) evText.addEventListener('input', updateAutoHint);
  updateAutoHint();
}
function updateAutoHint(){
  const hint = document.getElementById('evAutoHint');
  if(!hint) return;
  const coBtn = document.querySelector('#evCompany button.on');
  const isAuto = !coBtn || coBtn.dataset.co === 'auto';
  if(!isAuto){ hint.innerHTML = '<span class="em">🏷️</span><span>선택한 회사에 그대로 반영돼요.</span>'; return; }
  const t = (document.getElementById('evText')||{}).value || '';
  const co = C.autoCompanyFor(t);
  if(co){
    const info = COMPANIES.find(x=>x.id===co);
    hint.innerHTML = '<span class="em">🔎</span><span>자동으로 <b>'+info.emoji+' '+esc(info.name)+'</b>에 넣을게요.</span>';
  } else {
    hint.innerHTML = '<span class="em">🔎</span><span>소식을 적으면 어울리는 회사를 자동으로 찾아요.</span>';
  }
}

/* ---------- 클릭 액션 ---------- */
function handle(act, el){
  const c = C.child();
  switch(act){
    case 'tab': U.goTab(el.dataset.tab); break;
    case 'switchKid': {
      S().activeId = el.dataset.id; ui.pick = null;
      const nc = C.child();
      if(nc){ C.applyAutoAllowance(nc); C.syncMarketWeeks(nc); }
      save(); rerender(); break;
    }
    case 'addKid': openChildForm(); break;
    case 'toggleInvest': {
      c.investEnabled = c.investEnabled === false;
      save(); rerender();
      U.toast(esc(c.name)+(c.investEnabled ? ' 모의투자를 켰어요' : ' 모의투자를 껐어요'), {emoji:'📈'});
      break;
    }
    case 'editKid': openChildForm(el.dataset.id); break;
    case 'delKid': openChildForm(el.dataset.id); break;
    case 'preset': {
      const p = c.presets.find(x=>x.id===el.dataset.id);
      if(!p) break;
      const tx = C.addTx(c, {date:C.todayStr(), kind:'in', cat:'약속', amount:p.amount, memo:p.label});
      save(); rerender();
      el.classList.add('flash');
      U.toast('+' +C.fmt(p.amount)+' · '+esc(p.label), {emoji:p.emoji||'🏅', action:'undoPreset', id:tx.id, actionLabel:'되돌리기'});
      break;
    }
    case 'undoPreset': {
      const r = C.removeTx(c, el.dataset.id);
      save(); rerender();
      if(r.ok) U.toast('방금 기록을 되돌렸어요', {emoji:'↩️'});
      break;
    }
    case 'addPreset': openPresetForm(); break;
    case 'editPreset': openPresetForm(el.dataset.id); break;
    case 'delPreset': {
      const id = el.dataset.id;
      const p = c.presets.find(x=>x.id===id);
      U.confirmModal('약속 항목을 지울까요?', '‘'+esc(p?p.label:'')+'’ 버튼이 사라져요.', '지우기', ()=>{
        c.presets = c.presets.filter(x=>x.id!==id); save(); rerender();
      });
      break;
    }
    case 'selDay':
      ui.selDate = el.dataset.date; rerender(); break;
    case 'calMove': {
      let m = ui.calM + Number(el.dataset.d), y = ui.calY;
      if(m<0){m=11;y--;} if(m>11){m=0;y++;}
      ui.calM=m; ui.calY=y; rerender(); break;
    }
    case 'calToday':
      ui.calY = new Date().getFullYear(); ui.calM = new Date().getMonth(); ui.selDate = C.todayStr(); rerender(); break;
    case 'sumMove': {
      let m = ui.sumM + Number(el.dataset.d), y = ui.sumY;
      if(m<0){m=11;y--;} if(m>11){m=0;y++;}
      ui.sumM=m; ui.sumY=y; rerender(); break;
    }
    case 'addTx': openTx(el.dataset.date || C.todayStr(), 'out'); break;
    case 'addTxIn': openTx(el.dataset.date || C.todayStr(), 'in'); break;
    case 'addTxOut': openTx(el.dataset.date || C.todayStr(), 'out'); break;
    case 'openSpecial': openSpecial(); break;
    case 'openExpense': openExpense(); break;
    case 'openSavings': openSavings(el.dataset.dir||'in'); break;
    case 'goalEdit': openGoal(); break;
    case 'delTx': {
      const t = c.tx.find(x=>x.id===el.dataset.id);
      if(!t) break;
      if(t.cat==='투자'||t.cat==='투자회수'){
        U.toast('투자 기록은 <b>모의투자</b> 탭에서 정리해요.', {emoji:'📈'}); break;
      }
      U.confirmModal('기록을 지울까요?',
        esc(t.memo||t.cat)+' · '+C.fmt(t.amount)+' ('+C.fmtDateKo(t.date)+')<br>잔액도 함께 되돌려져요.',
        '지우기', ()=>{
          C.removeTx(c, t.id); save(); rerender();
          U.toast('기록을 지웠어요', {emoji:'🗑️'});
        });
      break;
    }
    case 'pickCo': pickCo(el.dataset.id); break;
    case 'sell': openSell(el.dataset.id); break;
    case 'advanceWeek': advanceWeekAction(); break;
    case 'saveAuto': saveAuto(); break;
    case 'applyEvent': applyEvent(); break;
    case 'clearEvent': clearEvent(el.dataset.id); break;
    case 'pinToggle': pinToggle(); break;
    case 'pinChange': pinChange(); break;
    case 'backup': exportJSON(); break;
    case 'restore': { const f=document.getElementById('fileInput'); if(f) f.click(); break; }
    case 'resetAll': resetAll(); break;
    default: break;
  }
}

/* ---------- 첫 실행 ---------- */
function openWelcome(){
  const emojis = ['🐰','🐻','🐱','🦊','🐼','🐥','🐯','🦄','🐳','🐢','🦁','🐨'];
  const body =
    '<div class="center" style="font-size:40px;margin:2px 0 4px">🐷</div>'+
    '<div class="set-desc center" style="text-align:center;margin-bottom:14px">아이의 용돈·저축·모의투자를 한 곳에서 기록해요.<br>먼저 아이 이름을 알려 주세요!</div>'+
    '<label class="field"><span>아이 이름</span><input class="input" id="wName" maxlength="12" placeholder="예: 하윤"></label>'+
    '<div class="field"><span>얼굴</span><div class="emoji-pick" id="wEmoji">'+
      emojis.map((e,i)=>'<button data-em="'+e+'" class="'+(i===0?'on':'')+'">'+e+'</button>').join('')+'</div></div>'+
    '<label class="field"><span>시작 잔액 (지금 갖고 있는 돈)</span><div class="amt-box"><input id="wCash" inputmode="numeric" value="10,000"><span class="won">원</span></div></label>'+
    '<div class="between" style="margin:2px 0 12px">'+
      '<div><b style="font-size:13px">📈 모의투자</b><div class="xs muted">켜면 주식 놀이 탭이 생겨요</div></div>'+
      '<button class="switch on" id="wInvest" type="button"><i></i><span class="kiv">켜짐</span></button>'+
    '</div>'+
    errBox('wErr')+
    '<button class="btn primary block" id="wGo">시작하기</button>'+
    '<div class="hint-line"><span class="em">💡</span><span>나중에 ⚙️ 보호자 설정에서 언제든 바꿀 수 있어요.</span></div>';
  const m = U.modal({title:'용돈 탐험대에 오신 것을 환영해요!', body});
  let em = '🐰', inv = true;
  m.el.querySelectorAll('#wEmoji button').forEach(b=> b.addEventListener('click', ()=>{
    em = b.dataset.em; m.el.querySelectorAll('#wEmoji button').forEach(x=>x.classList.toggle('on', x===b));
  }));
  const wInv = m.el.querySelector('#wInvest');
  if(wInv) wInv.addEventListener('click', ()=>{
    inv = !inv; wInv.classList.toggle('on', inv); wInv.querySelector('.kiv').textContent = inv?'켜짐':'꺼짐';
  });
  m.el.querySelector('#wGo').addEventListener('click', ()=>{
    const name = m.el.querySelector('#wName').value.trim();
    if(!name){ showErr('wErr','아이 이름을 적어 주세요.'); return; }
    const cash = C.parseAmount(m.el.querySelector('#wCash').value);
    const nc = C.newChild(name, em, '#F2B233', Math.max(0,cash), inv);
    S().children.push(nc); S().activeId = nc.id;
    save(); m.close(); rerender();
    U.toast(esc(name)+'의 용돈 탐험을 시작해요!', {emoji:'🎉', duration:3600});
  });
}

/* ---------- 시작 ---------- */
function refreshOnOpen(){
  const st = S();
  if(!st) return;
  let changed = false, notes = [];
  st.children.forEach(c=>{
    const r = C.applyAutoAllowance(c);
    if(r.count){ changed = true; notes.push(c.name+' 자동 용돈 '+C.fmt(r.total)); }
    const adv = C.syncMarketWeeks(c);
    if(adv){ changed = true; }
  });
  if(changed){ save(); rerender(); }
  if(notes.length) U.toast(notes[0]+' 들어왔어요', {emoji:'💰', duration:4000});
}
function boot(){
  const loaded = C.loadState();
  if(loaded) C.state = loaded;
  else C.state = {v:1, activeId:null, pin:{enabled:false, code:''}, children:[]};
  ui.tab = 'calendar';
  const today = new Date();
  ui.calY = today.getFullYear(); ui.calM = today.getMonth();
  ui.sumY = today.getFullYear(); ui.sumM = today.getMonth();
  ui.selDate = C.todayStr();
  if(S().children.length) refreshOnOpen(); else rerender();
  if(!loaded) openWelcome();

  document.addEventListener('click', e=>{
    const el = e.target.closest('[data-act]');
    if(!el) return;
    if(el.closest('.backdrop') && el.hasAttribute('data-close')) return;
    e.preventDefault();
    handle(el.dataset.act, el);
  });
  document.addEventListener('keydown', e=>{
    if(e.key==='Enter' && e.target.classList && e.target.classList.contains('co')){
      pickCo(e.target.dataset.id);
    }
  });
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) refreshOnOpen(); });
  $$('#tabs .tab').forEach(b=> b.addEventListener('click', ()=> U.goTab(b.dataset.tab)));
  document.getElementById('brandGear').addEventListener('click', ()=> U.goTab(ui.tab === 'settings' ? (ui.lastMain || 'calendar') : 'settings'));

  /* 테스트용 최소 핸들 */
  window.__allowance = {
    get state(){ return C.state; },
    save: ()=>C.save(),
    render: ()=>U.renderAll(),
    go: (t)=>U.goTab(t),
    handle, openTx, openWelcome
  };
}

function tabHTML(tab, c){ return tab === 'invest' ? investTab(c) : setTab(c); }
window.__ui2 = {tabHTML, afterRender, handle, doInvest, applyEvent, openSell, openGoal, advanceWeekAction, saveAuto, askPin};
if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
})();

</script>
</body>
